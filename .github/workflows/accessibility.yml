name: Accessibility baseline

# Проверка доступности гоняется на каждый pull request и падает только
# на регрессиях. Порог намеренно высокий: инструмент, который краснеет
# на всём подряд, выключают через две недели.

on:
  pull_request:
    paths:
      - "**/*.swift"
      - "Baselines/**"
  workflow_dispatch:

jobs:
  baseline:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Выбрать Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Юнит-тесты движка правил
        # Ядро не зависит от XCTest и симулятора, поэтому проверяется быстро
        # и отдельно: если сломаны правила, гонять симулятор бессмысленно.
        run: swift test

      - name: Прогон базовой линии на симуляторе
        run: |
          xcodebuild test \
            -scheme YourAppUITests \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath a11y.xcresult \
            | xcbeautify

      - name: Опубликовать отчёт в pull request
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: |
            a11y-report.md
            a11y.xcresult
